name: build

# The supervisor. It works out what is missing, dispatches generic workers,
# and keeps the published status up to date while they run. It never builds
# anything itself.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the plan without dispatching workers
        type: boolean
        default: false
  # Every three hours rather than nightly, which is what msys2-autobuild
  # does and for the same reason: the supervisor is incremental, so a pass
  # with nothing to build costs a minute. Nightly would leave a whole day
  # between merging a recipe change and anyone receiving the package.
  schedule:
    - cron: '0 0/3 * * *'

permissions: {}

concurrency:
  group: autobuild-supervisor
  cancel-in-progress: false

jobs:
  image:
    # Belt and braces: a schedule only ever runs from the default branch, but
    # saying so in the job means a copy of this file on another branch cannot
    # quietly start supervising too.
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/image.yml
    # A called workflow cannot be granted more than the calling job holds, and
    # the top of this file grants nothing, so the permissions it needs to push
    # the image have to be handed over here.
    permissions:
      contents: read
      packages: write

  # The worker path only breaks against a real SDK: pacman rejecting an option,
  # a directory owned by the wrong user, makepkg refusing to run as root. This
  # exercises it in the image the workers will use, before six of them are sent
  # off to fail the same way at once.
  smoke:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/build:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise the worker path against the real SDK
        run: python3 -m unittest tests.test_container -v

  # Which series exist is configuration, so it is read from there rather than
  # repeated here: a series added in a commit is supervised by the next run.
  series:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      names: ${{ steps.read.outputs.names }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: read
        run: echo "names=$(python3 -m vitasdk_autobuild list-series)" >> "$GITHUB_OUTPUT"

  supervise:
    # always(), because a sibling series losing its image is not this one's
    # business: the check below is what decides whether this series can run.
    if: ${{ always() && github.ref == 'refs/heads/main'
        && needs.series.result == 'success' }}
    needs: [image, smoke, series]
    # One run drives one series: each owns its staging area, its snapshot and
    # its status, so they can be planned at the same time without meeting.
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.series.outputs.names) }}
    runs-on: ubuntu-24.04
    # Long enough to follow a full rebuild of the catalogue.
    timeout-minutes: 1440
    permissions:
      contents: write
      actions: write
      packages: read
    env:
      VITASDK_AUTOBUILD_CACHE: ${{ github.workspace }}/.autobuild-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Loudly, and only for this series. What this replaces was `needs: image`
      # doing it for everyone at once.
      - name: Check this series has an image to build in
        env:
          TAGS: ${{ needs.image.outputs.tags }}
          SERIES: ${{ matrix.series }}
        shell: bash
        run: |
          python3 - <<'PYTHON' > "$RUNNER_TEMP/wanted"
          import json, os
          series = os.environ["SERIES"]
          # A world is "<series>/<arch>", or just "<arch>" for the unnamed one.
          for world, tag in json.loads(os.environ["TAGS"]).items():
              head, sep, _ = world.rpartition("/")
              if (head if sep else "") == series:
                  print(tag)
          PYTHON
          [[ -s $RUNNER_TEMP/wanted ]] || {
            echo "::error::no world is planned for series '${SERIES:-<unnamed>}'"
            exit 1
          }
          while read -r tag; do
            image="ghcr.io/${GITHUB_REPOSITORY@L}/build:$tag"
            docker manifest inspect "$image" >/dev/null 2>&1 || {
              echo "::error::series '${SERIES:-<unnamed>}' has no image: $image did not build"
              exit 1
            }
            echo "found $image"
          done < "$RUNNER_TEMP/wanted"

      - name: Plan, dispatch and follow the build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL_TOKEN: ${{ secrets.CHANNEL_TOKEN }}
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SERIES: ${{ matrix.series }}
        shell: bash
        run: |
          arguments=(--series "$SERIES" supervise --target-branch build-branch)
          if [[ $DRY_RUN == 'true' ]]; then
            arguments+=(--dry-run)
          fi
          python3 -m vitasdk_autobuild "${arguments[@]}"

      - name: Forget files no recipe asks for any more
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
          SERIES: ${{ matrix.series }}
        run: python3 -m vitasdk_autobuild --series "$SERIES" clean-assets

      - name: Refresh the staging repository index
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
          SERIES: ${{ matrix.series }}
        run: python3 -m vitasdk_autobuild --series "$SERIES" snapshot --staging
