name: maintenance

# The operations a maintainer needs now and then, runnable from the Actions
# tab so that unsticking a package never requires a local checkout and a
# token with write access.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        default: show
        options:
          - show
          - update-status
          - clear-failed
          - clean-assets
          - staging-index
      pattern:
        description: "For clear-failed: which markers to forget, e.g. icu4c-* (empty means all)"
        required: false
        type: string
        default: ''
      dry_run:
        description: Show what would happen without doing it
        type: boolean
        default: false
      series:
        description: Release series to act on, empty for the unnamed one
        type: string
        default: ''

permissions: {}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VITASDK_AUTOBUILD_CACHE: ${{ github.workspace }}/.autobuild-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ${{ inputs.action }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
          ACTION: ${{ inputs.action }}
          PATTERN: ${{ inputs.pattern }}
          DRY_RUN: ${{ inputs.dry_run }}
          SERIES: ${{ inputs.series }}
        shell: bash
        run: |
          case "$ACTION" in
            show)
              arguments=(show)
              ;;
            update-status)
              arguments=(update-status)
              ;;
            clear-failed)
              arguments=(clear-failed)
              if [[ -n $PATTERN ]]; then
                arguments+=(--pattern "$PATTERN")
              fi
              ;;
            clean-assets)
              arguments=(clean-assets)
              ;;
            staging-index)
              arguments=(snapshot --staging --work-dir "$RUNNER_TEMP/repository")
              ;;
            *)
              echo "::error::unknown action: $ACTION"
              exit 1
              ;;
          esac
          if [[ $DRY_RUN == 'true' && $ACTION != 'show' && $ACTION != 'staging-index' \
                && $ACTION != 'update-status' ]]; then
            arguments+=(--dry-run)
          fi
          python3 -m vitasdk_autobuild --series "$SERIES" "${arguments[@]}"
