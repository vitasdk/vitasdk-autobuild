# makepkg configuration used only to compute .SRCINFO for the build queue.
#
# The supervisor runs on a bare runner with no SDK, so this file has to get
# vita-makepkg far enough to print metadata and no further: no stripping, no
# checks, no package client. It must never be used to build anything.
#
# CARCH decides the architecture recorded in .SRCINFO and therefore the
# expected package file name, so it has to match the SDK's makepkg.conf.

CARCH="vita"
CHOST="arm-vita-eabi"
PREFIX=$VITASDK/arm-vita-eabi/

# Source protocols are validated against these two lists even when nothing is
# downloaded, and a recipe using an unlisted protocol aborts.
DLAGENTS=('ftp::/usr/bin/curl -gqfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          'http::/usr/bin/curl -gqb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'https::/usr/bin/curl -gqb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')
VCSCLIENTS=('bzr::bzr'
            'git::git'
            'hg::mercurial'
            'svn::subversion')

BUILDENV=(!distcc !color !ccache !check !sign)
OPTIONS=(!strip !docs !libtool !staticlibs !emptydirs !zipman !purge !debug)
INTEGRITY_CHECK=(sha256)

PKGEXT='.pkg.tar.xz'
SRCEXT='.src.tar.gz'
